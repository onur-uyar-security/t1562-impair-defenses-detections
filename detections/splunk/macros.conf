# macros.conf
# Edit these definitions ONCE to match your indexes and sourcetypes.
# All scenario queries refer to the macros, not to hard-coded indexes.

[sysmon]
definition = index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
iseval = 0

[wineventlog_security]
definition = index=windows source="XmlWinEventLog:Security"
iseval = 0

[wineventlog_system]
definition = index=windows source="XmlWinEventLog:System"
iseval = 0

[defender_operational]
definition = index=windows source="XmlWinEventLog:Microsoft-Windows-Windows Defender/Operational"
iseval = 0

[windows_firewall]
definition = index=windows source="XmlWinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall"
iseval = 0

[powershell_operational]
definition = index=windows source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational"
iseval = 0

[powershell_classic]
definition = index=windows source="XmlWinEventLog:Windows PowerShell"
iseval = 0

[linux_auditd]
definition = index=linux sourcetype="linux:audit"
iseval = 0

[linux_auditd_index]
definition = index=linux
iseval = 0

[aws_cloudtrail]
definition = index=aws sourcetype="aws:cloudtrail"
iseval = 0

[aws_cloudtrail_index]
definition = index=aws
iseval = 0

[azure_activity]
definition = index=azure sourcetype="azure:monitor:activity"
iseval = 0

[o365_management]
definition = index=o365 sourcetype="o365:management:activity"
iseval = 0

[network_syslog]
definition = index=network sourcetype IN ("cisco:ios", "cisco:asa", "syslog")
iseval = 0

[network_syslog_index]
definition = index=network
iseval = 0
