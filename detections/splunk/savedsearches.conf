# savedsearches.conf
# Production-style scheduling for the highest-value detections in this repository.
#
# Design choices (see docs/methodology.md):
#   - 15-minute schedule, window shifted back 5 minutes (-20m@m to -5m@m) to tolerate ingestion lag
#   - realtime_schedule = 0  -> continuous scheduling: skipped runs are executed later, no gaps
#   - Throttling per host (and user where relevant) for 1 hour -> one alert per incident, not dozens
#   - Cron minutes are staggered so not every search starts at :00
#   - action.* settings are left minimal; add email/notable/risk actions for your environment

[DI - T1685 - Defender Protection Disabled or Exclusion Added]
description = Defender real-time protection, scanning disabled, or exclusion/Disable* configuration change. Legacy T1562.001. Scenario 01 D1.
search = `defender_operational` EventCode IN (5001, 5010, 5012, 5007) \
| where EventCode!=5007 OR match(_raw, "(?i)(Exclusions\\\\(Paths|Extensions|Processes)|DisableRealtimeMonitoring|DisableAntiSpyware|DisableBehaviorMonitoring)") \
| table _time host EventCode _raw
enableSched = 1
cron_schedule = 2,17,32,47 * * * *
realtime_schedule = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h

[DI - T1685.001 - Audit Policy Auditing Removed]
description = System audit policy change (4719) that removes Success/Failure auditing. Legacy T1562.002. Scenario 02 D1.
search = `wineventlog_security` EventCode=4719 \
| rex field=Message "Subcategory:\s+(?<audit_subcategory>[^\r\n]+)" \
| rex field=Message "Changes:\s+(?<audit_changes>[^\r\n]+)" \
| where match(audit_changes, "(?i)removed") \
| table _time host SubjectUserName audit_subcategory audit_changes
enableSched = 1
cron_schedule = 4,19,34,49 * * * *
realtime_schedule = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host,SubjectUserName
alert.suppress.period = 1h

[DI - T1685.005 - Windows Event Log Cleared]
description = Security log (1102) or other channel (104) cleared. Legacy T1070.001. Scenario 13 D1.
search = (`wineventlog_security` EventCode=1102) OR (`wineventlog_system` EventCode=104) \
| table _time host EventCode Channel Message
enableSched = 1
cron_schedule = 6,21,36,51 * * * *
realtime_schedule = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h

[DI - T1688 - Boot Configuration Set to Safe Mode]
description = bcdedit used to set safeboot or disable recovery. Legacy T1562.009. Scenario 08 D1.
search = `sysmon` EventCode=1 Image="*\\bcdedit.exe" (CommandLine="*safeboot*" OR CommandLine="*recoveryenabled*no*" OR CommandLine="*bootstatuspolicy*ignoreallfailures*") \
| table _time host User ParentImage CommandLine
enableSched = 1
cron_schedule = */5 * * * *
realtime_schedule = 0
dispatch.earliest_time = -10m@m
dispatch.latest_time = -2m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h

[DI - T1685.002 - AWS CloudTrail Logging Stopped or Weakened]
description = CloudTrail, GuardDuty or AWS Config logging stopped/deleted/modified. Legacy T1562.008. Scenario 07 D1.
search = `aws_cloudtrail` eventName IN ("StopLogging", "DeleteTrail", "UpdateTrail", "PutEventSelectors", "DeleteFlowLogs", "DeleteDetector", "UpdateDetector", "DeleteConfigurationRecorder", "StopConfigurationRecorder") \
| table _time eventName userIdentity.arn sourceIPAddress userAgent awsRegion errorCode
enableSched = 1
cron_schedule = 8,23,38,53 * * * *
realtime_schedule = 0
dispatch.earliest_time = -30m@m
dispatch.latest_time = -10m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = userIdentity.arn
alert.suppress.period = 1h

[DI - T1685 - Critical Host Stopped Reporting]
description = High/critical asset has not sent any event for 30+ minutes. Missing-data detection that still works when sensors are blinded. Scenarios 05 D4 and 14.
search = | tstats latest(_time) as last_seen where index=* earliest=-24h by host \
| eval minutes_silent = round((now() - last_seen) / 60) \
| lookup asset_inventory.csv host OUTPUT criticality site \
| where minutes_silent > 30 AND in(criticality, "high", "critical") \
| table host site criticality last_seen minutes_silent
enableSched = 1
cron_schedule = 11,26,41,56 * * * *
realtime_schedule = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 2h
